# TLS terminates here. Put fullchain.pem / privkey.pem in ./nginx/certs (certbot or your CA).
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name devikkabydeepika.com www.devikkabydeepika.com;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  location ~* ^/(css|js|img)/ { root /srv/public; expires 7d; add_header Cache-Control "public, immutable"; try_files $uri @app; }
  location /webhooks/ { limit_req zone=perip burst=40 nodelay; proxy_pass http://app:3000; include /etc/nginx/proxy_params; }
  location / { limit_req zone=perip burst=60 nodelay; proxy_pass http://app:3000; include /etc/nginx/proxy_params; }
  location @app { proxy_pass http://app:3000; include /etc/nginx/proxy_params; }
}
