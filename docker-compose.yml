# docker compose up -d        → app + MySQL + nginx
# docker compose run --rm app npm run db:setup   (first time: migrate + seed)
# docker compose run --rm app npm run admin:create
services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_NAME:-devikka}
      MYSQL_USER: ${DB_USER:-devikka}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-change-me-root}"], interval: 10s, retries: 10 }
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment: { DB_HOST: db, DB_PORT: "3306", TRUST_PROXY: "1", PORT: "3000" }
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/devikka.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./public:/srv/public:ro
    depends_on: [app]
    restart: unless-stopped
volumes: { dbdata: {} }
